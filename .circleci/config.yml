version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.19.5
    working_directory: ~/project
    environment:
      CI: "true"

jobs:
  test:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install dependencies
          command: |
            npm i
            npm ci
      - save_cache:
          key: v1-npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run Vitest with coverage
          command: npm run test -- --run --coverage
      - store_artifacts:
          path: coverage
          destination: coverage

workflows:
  test_workflow:
    jobs:
      - test
